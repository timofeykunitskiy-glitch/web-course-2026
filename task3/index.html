<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Список задач</h1>
 
    <form class="todo-form" id="todo-form">
      <input type="text" id="todo-input" placeholder="Что нужно сделать?" autocomplete="off">
      <button type="submit" class="btn">Добавить</button>
    </form>
    <p class="warning" id="warning" hidden>Введите текст задачи</p>
 
    <p class="stats" id="stats"></p>
 
    <div class="filters" id="filters">
      <button type="button" class="filter active" data-filter="all">Все</button>
      <button type="button" class="filter" data-filter="active">Активные</button>
      <button type="button" class="filter" data-filter="completed">Завершённые</button>
    </div>
 
    <ul class="todo-list" id="todo-list"></ul>
  </main>
</body>
</html>
